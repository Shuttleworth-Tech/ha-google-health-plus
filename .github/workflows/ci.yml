name: CI

# No external actions are used in this workflow (org Actions policy is
# local_only); checkout is done with plain git and the workflow token.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Select Python 3.13
        run: |
          if command -v python3.13 >/dev/null; then
            PYBIN="$(dirname "$(command -v python3.13)")"
          else
            PYBIN="$(ls -d /opt/hostedtoolcache/Python/3.13*/x64/bin | head -1)"
          fi
          echo "$PYBIN" >> "$GITHUB_PATH"
          "$PYBIN/python3.13" --version
      - name: Install ruff
        run: python -m pip install --user ruff==0.14.6
      - name: Ruff lint
        run: python -m ruff check custom_components tests
      - name: Ruff format
        run: python -m ruff format --check custom_components tests

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Select Python 3.13
        run: |
          if command -v python3.13 >/dev/null; then
            PYBIN="$(dirname "$(command -v python3.13)")"
          else
            PYBIN="$(ls -d /opt/hostedtoolcache/Python/3.13*/x64/bin | head -1)"
          fi
          echo "$PYBIN" >> "$GITHUB_PATH"
          "$PYBIN/python3.13" --version
      - name: Install dependencies
        run: python -m pip install --user -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -vv
