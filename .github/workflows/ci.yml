name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements_test.txt') }}
      - name: Ruff lint and format check
        run: |
          nix develop -c bash -c '
            if [ ! -x .venv/bin/ruff ]; then
              python3 -m venv .venv
              ./.venv/bin/pip install -q -r requirements_test.txt
            fi
            ./.venv/bin/ruff check custom_components tests
            ./.venv/bin/ruff format --check custom_components tests
          '

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements_test.txt') }}
      - name: Debug snapshot paths
        run: ls -la tests/snapshots/ && head -3 tests/snapshots/test_diagnostics.ambr
      - name: Run tests
        run: |
          nix develop -c bash -c '
            if [ ! -x .venv/bin/pytest ]; then
              python3 -m venv .venv
              ./.venv/bin/pip install -q -r requirements_test.txt
            fi
            pwd
            ls -la tests/snapshots/ || echo "NO SNAPSHOTS DIR"
            ./.venv/bin/pytest tests/test_diagnostics.py::test_diagnostics_full_data -q --snapshot-update
            echo '--- ambr files modified in last 5 min:'
            find / -name '*.ambr' -mmin -5 2>/dev/null | grep -v proc || echo none
            echo '--- diff of workspace snapshots:'
            git status --short || true
            git diff -- tests/snapshots/ | head -40 || true
          '
