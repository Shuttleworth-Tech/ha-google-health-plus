name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3.21.9
      - name: Cache Python venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements_test.txt') }}
      - name: Prepare venv
        run: |
          nix develop -c bash -c '
            if [ ! -x .venv/bin/pytest ]; then
              python3 -m venv .venv
              ./.venv/bin/pip install -q -r requirements_test.txt
            fi
          '
      - name: Run tests
        run: nix develop -c bash -c './.venv/bin/pytest -vv'
      - name: Validate manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(nix develop -c python -c "import json; print(json.load(open('custom_components/google_health_plus/manifest.json'))['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "manifest version $VERSION does not match tag $TAG"
            exit 1
          fi
      - name: Build zip
        run: |
          find custom_components -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          nix develop -c bash -c 'cd custom_components/google_health_plus && zip -r "$GITHUB_WORKSPACE/google_health_plus.zip" .'
      - name: Create release with zip asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nix develop -c bash -c 'gh release create "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}/google_health_plus.zip" --title "${GITHUB_REF_NAME}" --generate-notes'
