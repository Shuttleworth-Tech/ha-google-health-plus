name: Release

# No external actions are used in this workflow (org Actions policy is
# local_only); checkout is done with plain git and the release is cut with
# the gh CLI preinstalled on the runner.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Select Python 3.13
        run: |
          if command -v python3.13 >/dev/null; then
            PYBIN="$(dirname "$(command -v python3.13)")"
          else
            PYBIN="$(ls -d /opt/hostedtoolcache/Python/3.13*/x64/bin | head -1)"
          fi
          echo "$PYBIN" >> "$GITHUB_PATH"
          "$PYBIN/python3.13" --version
      - name: Install dependencies
        run: python -m pip install --user -r requirements_test.txt
      - name: Run tests
        run: python -m pytest -vv
      - name: Validate manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import json; print(json.load(open('custom_components/google_health_plus/manifest.json'))['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "manifest version $VERSION does not match tag $TAG"
            exit 1
          fi
      - name: Build zip
        run: |
          cd custom_components
          zip -r ../google_health_plus.zip google_health_plus
          cd ..
      - name: Create release with zip asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" google_health_plus.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
